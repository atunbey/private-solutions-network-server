<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Solutions Network Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #061723;
      --bg-1: #0d2b3a;
      --bg-2: #123f4a;
      --ink-0: #ecf8f8;
      --ink-1: #b8d8d5;
      --accent-0: #16c79a;
      --accent-1: #ffbf69;
      --danger: #ef476f;
      --surface: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.16);
      --ok: #5dd39e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink-0);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 100% -20%, rgba(255, 191, 105, 0.2), transparent 60%),
        radial-gradient(1000px 500px at -10% 10%, rgba(22, 199, 154, 0.18), transparent 60%),
        linear-gradient(145deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
      padding: 24px;
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(120deg, rgba(22, 199, 154, 0.12), rgba(255, 191, 105, 0.08));
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      animation: riseIn 420ms ease;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.2vw, 2rem);
      letter-spacing: 0.4px;
    }

    .sub {
      margin-top: 6px;
      color: var(--ink-1);
      font-size: 0.98rem;
    }

    .token-bar {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      animation: riseIn 480ms ease;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      animation: riseIn 540ms ease;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      backdrop-filter: blur(4px);
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.12);
    }

    .panel-body {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--ink-1);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink-0);
      padding: 9px 10px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.84rem;
    }

    input::placeholder { color: #9fc2be; }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: transform 140ms ease, opacity 140ms ease;
    }

    button:hover { transform: translateY(-1px); }

    .btn-primary { background: var(--accent-0); color: #03251f; }
    .btn-ghost { background: rgba(255,255,255,0.12); color: var(--ink-0); }
    .btn-danger { background: var(--danger); color: #fff; }

    .status {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      min-height: 42px;
      background: rgba(0, 0, 0, 0.16);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      color: var(--ink-1);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok { color: var(--ok); }
    .bad { color: #ff99ad; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      vertical-align: top;
    }

    th {
      color: var(--ink-1);
      font-size: 0.75rem;
      letter-spacing: 0.35px;
      text-transform: uppercase;
    }

    .scroll {
      max-height: 260px;
      overflow: auto;
    }

    .inline-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-block;
      border: 1px solid var(--line);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.72rem;
      margin-right: 6px;
      margin-top: 3px;
      background: rgba(0, 0, 0, 0.12);
    }

    .pill {
      border-radius: 999px;
      font-size: 0.68rem;
      padding: 3px 7px;
      background: rgba(255, 191, 105, 0.2);
      color: #ffe1ba;
      border: 1px solid rgba(255, 191, 105, 0.35);
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 880px) {
      body { padding: 14px; }
      .token-bar { grid-template-columns: 1fr; }
      .row, .row-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1>Private Solutions Network Admin Console</h1>
      <div class="sub">Manage users, groups, apps, and edge devices from one dashboard.</div>
    </section>

    <section class="token-bar">
      <input id="token" type="password" placeholder="Paste Bearer token from Keycloak">
      <button class="btn-primary" id="saveTokenBtn">Save Token</button>
      <button class="btn-ghost" id="refreshAllBtn">Refresh All</button>
    </section>

    <div id="status" class="status">Ready.</div>

    <section class="grid">
      <article class="panel">
        <h2>Users</h2>
        <div class="panel-body">
          <div class="row-3">
            <div>
              <label for="userExternalId">External Id</label>
              <input id="userExternalId" placeholder="keycloak-sub-...">
            </div>
            <div>
              <label for="userName">Username</label>
              <input id="userName" placeholder="jsmith">
            </div>
            <div>
              <label for="userEmail">Email</label>
              <input id="userEmail" placeholder="jsmith@example.com">
            </div>
          </div>
          <button class="btn-primary" id="createUserBtn">Create User</button>

          <div class="row">
            <div>
              <label for="assignUserSelect">User</label>
              <select id="assignUserSelect"></select>
            </div>
            <div>
              <label for="assignGroupSelect">Group</label>
              <select id="assignGroupSelect"></select>
            </div>
          </div>
          <div class="inline-actions">
            <button class="btn-ghost" id="assignGroupBtn">Assign User To Group</button>
            <button class="btn-danger" id="removeGroupBtn">Remove User From Group</button>
          </div>

          <div class="scroll">
            <table>
              <thead>
                <tr><th>User</th><th>Email</th><th>Groups</th></tr>
              </thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </div>
      </article>

      <article class="panel">
        <h2>Groups</h2>
        <div class="panel-body">
          <div class="row">
            <div>
              <label for="groupName">Group Name</label>
              <input id="groupName" placeholder="teachers">
            </div>
            <div style="display:flex;align-items:end;">
              <button class="btn-primary" id="createGroupBtn" style="width:100%;">Create Group</button>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="groupForAppSelect">Group</label>
              <select id="groupForAppSelect"></select>
            </div>
            <div>
              <label for="appForGroupSelect">App</label>
              <select id="appForGroupSelect"></select>
            </div>
          </div>
          <div class="inline-actions">
            <button class="btn-ghost" id="assignAppBtn">Assign App To Group</button>
            <button class="btn-danger" id="removeAppBtn">Remove App From Group</button>
          </div>

          <div class="scroll">
            <table>
              <thead>
                <tr><th>Name</th><th>Users</th><th>Apps</th></tr>
              </thead>
              <tbody id="groupsBody"></tbody>
            </table>
          </div>
        </div>
      </article>

      <article class="panel">
        <h2>Applications</h2>
        <div class="panel-body">
          <div class="row-3">
            <div>
              <label for="appName">Name</label>
              <input id="appName" placeholder="Moodle">
            </div>
            <div>
              <label for="appSlug">Balena Slug</label>
              <input id="appSlug" placeholder="myorg/moodle">
            </div>
            <div>
              <label for="appMode">Backup Mode</label>
              <select id="appMode">
                <option value="true">Server Authoritative</option>
                <option value="false">Edge Autonomous</option>
              </select>
            </div>
          </div>
          <button class="btn-primary" id="createAppBtn">Create App</button>

          <div class="scroll">
            <table>
              <thead>
                <tr><th>Name</th><th>Slug</th><th>Mode</th></tr>
              </thead>
              <tbody id="appsBody"></tbody>
            </table>
          </div>
        </div>
      </article>

      <article class="panel">
        <h2>Edge Devices</h2>
        <div class="panel-body">
          <div class="row">
            <div>
              <label for="deviceUuid">Device UUID</label>
              <input id="deviceUuid" placeholder="a1b2c3d4-...">
            </div>
            <div>
              <label for="deviceName">Display Name</label>
              <input id="deviceName" placeholder="Classroom Node 1">
            </div>
          </div>
          <button class="btn-primary" id="createDeviceBtn">Register Device</button>

          <div class="row">
            <div>
              <label for="assignDeviceSelect">Device</label>
              <select id="assignDeviceSelect"></select>
            </div>
            <div>
              <label for="assignDeviceUserSelect">User</label>
              <select id="assignDeviceUserSelect"></select>
            </div>
          </div>
          <div class="inline-actions">
            <button class="btn-ghost" id="assignDeviceUserBtn">Assign User To Device</button>
            <button class="btn-danger" id="removeDeviceUserBtn">Remove User From Device</button>
          </div>

          <div class="scroll">
            <table>
              <thead>
                <tr><th>Device</th><th>UUID</th><th>Assigned Users</th></tr>
              </thead>
              <tbody id="devicesBody"></tbody>
            </table>
          </div>
        </div>
      </article>
    </section>
  </div>

  <script>
    const tokenInput = document.getElementById('token');
    const statusEl = document.getElementById('status');

    const usersBody = document.getElementById('usersBody');
    const groupsBody = document.getElementById('groupsBody');
    const appsBody = document.getElementById('appsBody');
    const devicesBody = document.getElementById('devicesBody');

    const state = { users: [], groups: [], apps: [], devices: [] };

    tokenInput.value = localStorage.getItem('psn_admin_token') || '';

    function setStatus(message, ok = true) {
      statusEl.textContent = message;
      statusEl.classList.remove('ok', 'bad');
      statusEl.classList.add(ok ? 'ok' : 'bad');
    }

    async function api(path, options = {}) {
      const token = tokenInput.value.trim();
      const headers = Object.assign({}, options.headers || {}, { 'Accept': 'application/json' });
      if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const res = await fetch(path, Object.assign({}, options, { headers }));
      if (!res.ok) {
        const body = await res.text();
        throw new Error(`${res.status} ${res.statusText}${body ? ` | ${body}` : ''}`);
      }

      if (res.status === 204) return null;
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    function optHtml(items, valueField, labelFn) {
      return items.map(x => `<option value="${x[valueField]}">${labelFn(x)}</option>`).join('');
    }

    function refreshSelectors() {
      document.getElementById('assignUserSelect').innerHTML = optHtml(state.users, 'id', u => `${u.username} (${u.email})`);
      document.getElementById('assignDeviceUserSelect').innerHTML = optHtml(state.users, 'id', u => `${u.username} (${u.email})`);
      document.getElementById('assignGroupSelect').innerHTML = optHtml(state.groups, 'id', g => g.name);
      document.getElementById('groupForAppSelect').innerHTML = optHtml(state.groups, 'id', g => g.name);
      document.getElementById('appForGroupSelect').innerHTML = optHtml(state.apps, 'id', a => `${a.name} (${a.balenaAppSlug})`);
      document.getElementById('assignDeviceSelect').innerHTML = optHtml(state.devices, 'id', d => `${d.displayName || d.deviceUuid}`);
    }

    function renderUsers(details) {
      usersBody.innerHTML = details.map(u => {
        const groups = (u.groups || []).map(g => `<span class="chip">${g.name}</span>`).join('') || '-';
        return `<tr><td>${u.username}</td><td>${u.email}</td><td>${groups}</td></tr>`;
      }).join('');
    }

    function renderGroups(details) {
      groupsBody.innerHTML = details.map(g => {
        const users = (g.users || []).map(u => `<span class="chip">${u.username}</span>`).join('') || '-';
        const apps = (g.applications || []).map(a => `<span class="chip">${a.name}</span>`).join('') || '-';
        return `<tr><td>${g.name}</td><td>${users}</td><td>${apps}</td></tr>`;
      }).join('');
    }

    function renderApps() {
      appsBody.innerHTML = state.apps.map(a => {
        const mode = a.serverAuthoritative ? 'Server Authoritative' : 'Edge Autonomous';
        return `<tr><td>${a.name}</td><td>${a.balenaAppSlug}</td><td><span class="pill">${mode}</span></td></tr>`;
      }).join('');
    }

    function renderDevices(details) {
      devicesBody.innerHTML = details.map(d => {
        const users = (d.assignedUsers || []).map(u => `<span class="chip">${u.username}</span>`).join('') || '-';
        return `<tr><td>${d.displayName || '-'}</td><td>${d.deviceUuid}</td><td>${users}</td></tr>`;
      }).join('');
    }

    async function loadAll() {
      try {
        setStatus('Refreshing data...');

        const [users, groups, apps, devices] = await Promise.all([
          api('/api/admin/users'),
          api('/api/admin/groups'),
          api('/api/admin/apps'),
          api('/api/admin/devices')
        ]);

        state.users = users || [];
        state.groups = groups || [];
        state.apps = apps || [];
        state.devices = devices || [];

        refreshSelectors();

        const userDetails = await Promise.all(state.users.map(u => api(`/api/admin/users/${u.id}`)));
        const groupDetails = await Promise.all(state.groups.map(g => api(`/api/admin/groups/${g.id}`)));
        const deviceDetails = await Promise.all(state.devices.map(d => api(`/api/admin/devices/${d.id}`)));

        renderUsers(userDetails);
        renderGroups(groupDetails);
        renderApps();
        renderDevices(deviceDetails);

        setStatus('Data loaded successfully.');
      } catch (err) {
        setStatus(`Load failed: ${err.message}`, false);
      }
    }

    async function act(fn, success) {
      try {
        await fn();
        setStatus(success);
        await loadAll();
      } catch (err) {
        setStatus(`Action failed: ${err.message}`, false);
      }
    }

    document.getElementById('saveTokenBtn').addEventListener('click', () => {
      localStorage.setItem('psn_admin_token', tokenInput.value.trim());
      setStatus('Token saved to browser storage.');
    });

    document.getElementById('refreshAllBtn').addEventListener('click', loadAll);

    document.getElementById('createUserBtn').addEventListener('click', () => act(async () => {
      await api('/api/admin/users', {
        method: 'POST',
        body: JSON.stringify({
          externalId: document.getElementById('userExternalId').value,
          username: document.getElementById('userName').value,
          email: document.getElementById('userEmail').value
        })
      });
    }, 'User created.'));

    document.getElementById('createGroupBtn').addEventListener('click', () => act(async () => {
      await api('/api/admin/groups', {
        method: 'POST',
        body: JSON.stringify({ name: document.getElementById('groupName').value })
      });
    }, 'Group created.'));

    document.getElementById('createAppBtn').addEventListener('click', () => act(async () => {
      await api('/api/admin/apps', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('appName').value,
          balenaAppSlug: document.getElementById('appSlug').value,
          serverAuthoritative: document.getElementById('appMode').value === 'true'
        })
      });
    }, 'Application created.'));

    document.getElementById('createDeviceBtn').addEventListener('click', () => act(async () => {
      await api('/api/admin/devices', {
        method: 'POST',
        body: JSON.stringify({
          deviceUuid: document.getElementById('deviceUuid').value,
          displayName: document.getElementById('deviceName').value
        })
      });
    }, 'Device registered.'));

    document.getElementById('assignGroupBtn').addEventListener('click', () => act(async () => {
      const userId = document.getElementById('assignUserSelect').value;
      const groupId = document.getElementById('assignGroupSelect').value;
      await api(`/api/admin/users/${userId}/groups/${groupId}`, { method: 'POST' });
    }, 'User assigned to group.'));

    document.getElementById('removeGroupBtn').addEventListener('click', () => act(async () => {
      const userId = document.getElementById('assignUserSelect').value;
      const groupId = document.getElementById('assignGroupSelect').value;
      await api(`/api/admin/users/${userId}/groups/${groupId}`, { method: 'DELETE' });
    }, 'User removed from group.'));

    document.getElementById('assignAppBtn').addEventListener('click', () => act(async () => {
      const groupId = document.getElementById('groupForAppSelect').value;
      const appId = document.getElementById('appForGroupSelect').value;
      await api(`/api/admin/groups/${groupId}/apps/${appId}`, { method: 'POST' });
    }, 'App assigned to group.'));

    document.getElementById('removeAppBtn').addEventListener('click', () => act(async () => {
      const groupId = document.getElementById('groupForAppSelect').value;
      const appId = document.getElementById('appForGroupSelect').value;
      await api(`/api/admin/groups/${groupId}/apps/${appId}`, { method: 'DELETE' });
    }, 'App removed from group.'));

    document.getElementById('assignDeviceUserBtn').addEventListener('click', () => act(async () => {
      const deviceId = document.getElementById('assignDeviceSelect').value;
      const userId = document.getElementById('assignDeviceUserSelect').value;
      await api(`/api/admin/devices/${deviceId}/users/${userId}`, { method: 'POST' });
    }, 'User assigned to device.'));

    document.getElementById('removeDeviceUserBtn').addEventListener('click', () => act(async () => {
      const deviceId = document.getElementById('assignDeviceSelect').value;
      const userId = document.getElementById('assignDeviceUserSelect').value;
      await api(`/api/admin/devices/${deviceId}/users/${userId}`, { method: 'DELETE' });
    }, 'User removed from device.'));

    loadAll();
  </script>
</body>
</html>
