events {}
http {
  server {
    listen 80;

    location /api/admin/ {
      proxy_pass http://admin-api:8080;
    }

    location /api/policy/ {
      proxy_pass http://policy-api:8081;
    }

    location /auth/ {
      proxy_pass http://keycloak:8080/;
    }

    location / {
      proxy_pass http://admin-portal:80;
    }
  }
}
