events {}
http {
  server {
    listen 80;

    location /api/admin/ {
      proxy_pass http://admin-api:8080;
    }

    location /api/policy/ {
      proxy_pass http://policy-api:8081;
    }

    location /auth/ {
      proxy_pass http://keycloak:8080/;
    }

    # Keycloak login pages emit absolute paths like /resources and /realms.
    # Route those to Keycloak so styles/scripts and form posts resolve correctly.
    location /resources/ {
      proxy_pass http://keycloak:8080/resources/;
    }

    location /realms/ {
      proxy_pass http://keycloak:8080/realms/;
    }

    location / {
      proxy_pass http://admin-portal:80;
    }
  }
}
